name: tile-server Deploy

on:
    push:
        branches: [main]
        paths:
            - 'packages/tile-server/**'
            # `generate` builds tiles per registry city, so a registry-only change must rebuild.
            - 'packages/cities/**'
            - '.github/workflows/tile-server-deploy.yml'
    workflow_dispatch: {}

# Newest commit wins; never run two deploys at once.
concurrency:
    group: deploy-tile-server
    cancel-in-progress: true

jobs:
    deploy:
        # Gated on the public base URL being configured. Set the `TILES_BASE_URL` repo variable
        # (e.g. https://basemap.freifahren.org) only after the R2 bucket's custom domain + the
        # "Respect Strong ETags" cache rule are in place. Until then this job is skipped, so merging
        # this workflow never runs against an unconfigured edge and never affects existing users.
        if: ${{ vars.TILES_BASE_URL != '' }}
        runs-on: ubuntu-latest
        # Records a GitHub deployment for the basemap so it shows in the repo's Deployments tab.
        environment:
            name: tile-server
            url: ${{ vars.TILES_BASE_URL }}
        permissions:
            contents: read
        defaults:
            run:
                working-directory: packages/tile-server
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # Downloads each city's OSM extract, runs tilemaker, and writes dist/<city>.pmtiles +
            # dist/styles/<city>.json — the same script local dev uses. The commit sha is the single
            # version lever: it goes into both the style's archive URL (here) and the upload key
            # (below), so they can never diverge.
            - name: Generate tiles + styles
              env:
                  TILES_BASE_URL: ${{ vars.TILES_BASE_URL }}
              run: TILES_VERSION="${GITHUB_SHA::8}" bun run generate

            - name: Upload to R2
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  set -euo pipefail
                  SHA="${GITHUB_SHA::8}"
                  # Upload exactly what `generate` produced — one archive per dist/<city>.pmtiles.
                  for f in dist/*.pmtiles; do
                      city="$(basename "$f" .pmtiles)"
                      # Immutable, versioned archive — long cache, never purged (the /v<sha>/ path is
                      # the cache-bust).
                      bunx wrangler@latest r2 object put "freifahren-tiles/v$SHA/$city.pmtiles" \
                          --file "dist/$city.pmtiles" \
                          --content-type application/octet-stream \
                          --cache-control "public, max-age=31536000, immutable" \
                          --remote
                      # Pre-compressed because a custom domain serves R2 objects byte-for-byte — the
                      # zone's Brotli setting reaches Pages assets but never R2 — and the style is on
                      # the critical path: MapLibre requests no tile until it resolves. `-n` keeps the
                      # bytes identical for identical input, so the strong ETag survives a rebuild.
                      gzip -9 -n -c "dist/styles/$city.json" > "dist/styles/$city.json.gz"
                      # The style is the only mutable pointer, and it already references this build's
                      # immutable /v<sha>/ archive. `s-maxage` holds it at the edge for a day (at 60s
                      # it fell out constantly, so most requests paid a full origin round trip) while
                      # `max-age` keeps browsers checking back; the purge below propagates a redeploy.
                      bunx wrangler@latest r2 object put "freifahren-tiles/styles/$city.json" \
                          --file "dist/styles/$city.json.gz" \
                          --content-type application/json \
                          --content-encoding gzip \
                          --cache-control "public, max-age=60, s-maxage=86400" \
                          --remote
                  done

            # Only the style needs purging — the archive is immutable under /v<sha>/ and is never
            # overwritten. A skipped purge degrades gracefully (the edge keeps serving the previous
            # style, which points at a still-present archive), but a *failed* one is a real problem
            # worth failing the deploy over, so a bad token can't quietly pin the basemap for a day.
            - name: Purge basemap style cache
              env:
                  CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  TILES_BASE_URL: ${{ vars.TILES_BASE_URL }}
              run: |
                  set -euo pipefail
                  if [ -z "${CLOUDFLARE_ZONE_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
                      echo "Skipping style cache purge (CLOUDFLARE_ZONE_ID or CLOUDFLARE_API_TOKEN not set)"
                      exit 0
                  fi
                  files=""
                  for f in dist/*.pmtiles; do
                      city="$(basename "$f" .pmtiles)"
                      files="${files:+$files,}\"${TILES_BASE_URL%/}/styles/$city.json\""
                  done
                  response="$(curl -sS -X POST \
                      "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
                      -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                      -H "Content-Type: application/json" \
                      --data "{\"files\":[$files]}")"
                  echo "$response"
                  echo "$response" | grep -q '"success":true'
