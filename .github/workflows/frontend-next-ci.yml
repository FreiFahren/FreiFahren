name: frontend-next CI

on:
    pull_request:
        branches: [main]
        paths:
            - 'packages/frontend-next/**'
            - '.github/workflows/frontend-next-ci.yml'

jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: packages/frontend-next

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Install API test dependencies
              run: bun install --cwd ../api-worker --frozen-lockfile

            - name: Run Prettier check
              run: bun run format:check

            - name: Run ESLint
              run: bun run lint

            # Fast, browserless checks on the app's pure logic. Placed before the build so a
            # broken invariant fails in seconds rather than after a full bundle and a browser
            # download.
            - name: Run unit tests
              run: bun run test:unit

            # `bun run build` runs `tsc -b` then `vite build`, so this gates both type errors and
            # build failures — neither of which the lint/format steps above catch.
            - name: Run build
              run: bun run build

            - name: Install Chromium
              run: bunx playwright install --with-deps chromium

            - name: Run PWA integration test
              run: bun run test
