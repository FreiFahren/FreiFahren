name: Preview

# No `paths:` filter here on purpose: it would also gate the `closed` event, so a PR that provisioned
# a preview and then moved its backend changes out of the diff before closing would never trigger
# cleanup, leaving the Worker and its databases behind. The path check lives on the `changes` job.
on:
    pull_request:
        types: [opened, reopened, synchronize, closed]

# Never cancelled: a cancelled migration or report load would leave a half-provisioned database.
concurrency:
    group: preview-${{ github.event.pull_request.number }}
    cancel-in-progress: false

jobs:
    changes:
        if: github.event.action != 'closed'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            api: ${{ steps.filter.outputs.api }}
        steps:
            - name: Detect backend changes
              id: filter
              uses: actions/github-script@v7
              with:
                  script: |
                      const { owner, repo } = context.repo
                      const files = await github.paginate(github.rest.pulls.listFiles, {
                        owner,
                        repo,
                        pull_number: context.issue.number,
                        per_page: 100,
                      })
                      const patterns = [
                        /^packages\/api-worker\//,
                        /^packages\/cities\//,
                        /^\.github\/workflows\/preview\.yml$/,
                      ]
                      const changed = files.some((file) => patterns.some((pattern) => pattern.test(file.filename)))
                      core.setOutput('api', changed ? 'true' : 'false')

    api:
        needs: changes
        if: >-
            github.event.action != 'closed' &&
            needs.changes.outputs.api == 'true' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
            pull-requests: write
        defaults:
            run:
                working-directory: packages/api-worker
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            # Passed via env (not interpolated into a run script) to avoid shell injection.
            PR_NUMBER: ${{ github.event.pull_request.number }}
            PREVIEW_CONFIG: wrangler.preview.json

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Every step below passes this config, which is what keeps them off production.
            - name: Provision preview databases
              run: bun run preview:databases --pr "$PR_NUMBER" --out "$PREVIEW_CONFIG"

            - name: Apply migrations
              run: bun run db:migrate:remote --config "$PREVIEW_CONFIG"

            # Only cities in both registries: a database can be provisioned before its transit
            # configuration lands, and such a city can be migrated but not seeded or served.
            - name: Resolve city list
              run: |
                  set -euo pipefail
                  slugs=$(bun -e 'import { CITY_SLUGS, CITY_DATABASE_SLUGS } from "../cities/src/index.ts"; const provisioned = new Set<string>(CITY_DATABASE_SLUGS); for (const slug of CITY_SLUGS) if (provisioned.has(slug)) console.log(slug)' | tr '\n' ' ')
                  echo "CITY_SLUGS=$slugs" >> "$GITHUB_ENV"

            - name: Seed reference data
              run: |
                  set -euo pipefail
                  for city in $CITY_SLUGS; do
                    bun run seed --city "$city" --remote --config "$PREVIEW_CONFIG"
                  done

            - name: Copy recent production reports
              run: bun run db:copy-reports --config "$PREVIEW_CONFIG"

            - name: Deploy preview API worker
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: packages/api-worker
                  command: deploy --config wrangler.preview.json

            - name: Resolve preview URL
              id: url
              run: |
                  set -euo pipefail
                  subdomain=$(curl --fail --silent --show-error \
                    --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                    "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
                    | jq --exit-status --raw-output '.result.subdomain')
                  echo "url=https://api-pr-${PR_NUMBER}.${subdomain}.workers.dev" >> "$GITHUB_OUTPUT"

            - name: Smoke test every city
              env:
                  PREVIEW_URL: ${{ steps.url.outputs.url }}
              run: |
                  set -euo pipefail

                  # A freshly deployed workers.dev hostname 404s at the edge until it propagates, which
                  # is a second or two after `wrangler deploy` returns. Wait for the Worker to answer so
                  # that the assertions below fail only on a genuinely broken preview.
                  for attempt in $(seq 1 12); do
                    if curl --fail --silent --output /dev/null \
                        "${PREVIEW_URL}/v0/transit/stations?city=${CITY_SLUGS%% *}"; then
                      break
                    fi
                    if [ "$attempt" -eq 12 ]; then
                      echo "Preview never became reachable at $PREVIEW_URL" >&2
                      exit 1
                    fi
                    sleep 5
                  done

                  for city in $CITY_SLUGS; do
                    stations=$(curl --fail --silent --show-error --location \
                      "${PREVIEW_URL}/v0/transit/stations?city=${city}" | jq 'length')
                    if [ "$stations" -lt 1 ]; then
                      echo "No stations returned for $city" >&2
                      exit 1
                    fi
                    echo "$city: $stations stations"
                  done

            - name: Comment preview link on pull request
              uses: actions/github-script@v7
              env:
                  PREVIEW_URL: ${{ steps.url.outputs.url }}
              with:
                  script: |
                      const marker = '<!-- api-preview -->'
                      const url = process.env.PREVIEW_URL
                      const [city] = (process.env.CITY_SLUGS ?? '').split(' ').filter(Boolean)
                      const lines = [marker, `🧪 **API preview** — \`${url}\``, '']
                      if (city) {
                        lines.push(
                          `The root has no route, so start at [recent reports](${url}/v0/reports?city=${city}).`,
                          ''
                        )
                      }
                      lines.push('Not previewed: the app, the Telegram bot and the basemap still point at production.')
                      const body = lines.join('\n')
                      const { owner, repo } = context.repo
                      const issue_number = context.issue.number
                      const comments = await github.paginate(github.rest.issues.listComments, {
                        owner,
                        repo,
                        issue_number,
                      })
                      const existing = comments.find(
                        (comment) => comment.user.type === 'Bot' && comment.body?.includes(marker)
                      )
                      if (existing) {
                        await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
                      } else {
                        await github.rest.issues.createComment({ owner, repo, issue_number, body })
                      }

    cleanup:
        # No path gate, so a preview can never outlive its PR even if the backend changes were
        # reverted before closing. Both deletes are idempotent.
        if: >-
            github.event.action == 'closed' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions:
            contents: read
        defaults:
            run:
                working-directory: packages/api-worker
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            PR_NUMBER: ${{ github.event.pull_request.number }}

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Delete preview API worker
              run: |
                  set -uo pipefail
                  worker_name="api-pr-${PR_NUMBER}"
                  output=$(npx wrangler delete --name "$worker_name" --force 2>&1)
                  status=$?
                  echo "$output"
                  if [ "$status" -eq 0 ]; then
                    echo "Deleted preview worker $worker_name."
                    exit 0
                  fi
                  # A PR that never deployed a preview (or was already cleaned up) has no Worker to
                  # delete — Cloudflare returns script_not_found (code 10007). That is expected, not a
                  # failure. Any other error (auth, network) must fail loudly so a real leak is noticed.
                  if echo "$output" | grep -qiE 'code: *10007|script_not_found|workers\.api\.error\.not_found'; then
                    echo "No preview worker named $worker_name exists; nothing to clean up."
                    exit 0
                  fi
                  echo "Failed to delete preview worker $worker_name (exit $status)." >&2
                  exit "$status"

            - name: Delete preview databases
              run: bun run preview:databases --pr "$PR_NUMBER" --destroy
