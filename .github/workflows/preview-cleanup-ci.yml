name: Preview Cleanup CI

on:
    pull_request:
        paths:
            - '.github/scripts/cleanup-previews*'
            - '.github/workflows/preview*.yml'

jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - run: node --test .github/scripts/cleanup-previews.test.mjs
